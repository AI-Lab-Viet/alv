name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "infra/**", "assets/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/alv

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: api }
          - { name: hanh, context: "Hành Module" }
          - { name: web, context: web }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # only used by web (NEXT_PUBLIC_* are baked into the JS bundle)
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.DOMAIN }}
            NEXT_PUBLIC_BACKEND_URL=https://hanh.${{ vars.DOMAIN }}
            NEXT_PUBLIC_WEBSOCKET_URL=wss://hanh.${{ vars.DOMAIN }}/interaction_agent
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Write .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          umask 077
          cat > deploy/.env <<EOF
          REGISTRY=$REGISTRY
          TAG=${{ github.sha }}
          DOMAIN=${{ vars.DOMAIN }}
          GEMINI_API_KEY=$GEMINI_API_KEY
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_KEY=$SUPABASE_KEY
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Ship bundle and deploy over IAP SSH
        run: |
          tar -C deploy -cz . | gcloud compute ssh "${{ vars.VM_NAME }}" \
            --zone "${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            --command "sudo mkdir -p /var/lib/alv && sudo tar -xz --no-same-owner -C /var/lib/alv && sudo bash /var/lib/alv/deploy.sh"

      - name: Smoke test
        run: |
          for url in "https://${{ vars.DOMAIN }}" "https://api.${{ vars.DOMAIN }}/" "https://hanh.${{ vars.DOMAIN }}/health"; do
            curl -sSf -o /dev/null --retry 12 --retry-delay 10 --retry-all-errors "$url"
            echo "OK $url"
          done
